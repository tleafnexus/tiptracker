{% extends "base.html" %}
{% set hide_nav = True %}
{% block title %}Log in · Tip Tracker{% endblock %}
{% block content %}
<div class="card login">
  <h1 style="margin-bottom:14px">Tip Tracker</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field"><label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
             value="{{ username }}" {% if not username %}autofocus{% endif %} required></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" {% if username %}autofocus{% endif %} required></div>
    <button class="btn primary block" type="submit">Log in</button>
  </form>
  <p class="muted small" style="margin:14px 0 0">Forgot your password? Ask whoever runs this server to reset it.</p>
</div>
{% endblock %}
