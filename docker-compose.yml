services:
  tiptracker:
    build: .
    container_name: tiptracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      TZ: America/Denver
      # Setup key: needed once, to create the first (admin) account. Keep it secret.
      APP_PASSWORD: "change-me"
      # Uncomment when the app is only reached over HTTPS (reverse proxy / Cloudflare Tunnel):
      # SECURE_COOKIES: "1"
